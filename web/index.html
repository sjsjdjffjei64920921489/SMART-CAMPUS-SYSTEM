<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Campus Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container py-5">
    <section id="loginView" class="login-shell mx-auto">
      <div class="brand-mark">SC</div>
      <p class="eyebrow">SMART CAMPUS / E-CAMPUS</p>
      <h1>Academic information, in one place.</h1>
      <p class="muted">Sign in to manage courses, attendance, results, and student records.</p>
      <form id="loginForm" class="mt-4">
        <label class="form-label" for="username">Username</label>
        <input class="form-control mb-3" id="username" required autocomplete="username">
        <label class="form-label" for="password">Password</label>
        <input class="form-control mb-3" id="password" type="password" required autocomplete="current-password">
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
        <p id="loginError" class="alert alert-danger mt-3 d-none"></p>
      </form>
      <p class="demo-note">Demo accounts: admin / admin123, lecturer / lecturer123, student / student123</p>
    </section>

    <section id="dashboardView" class="d-none">
      <header class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
          <p class="eyebrow mb-2">SMART CAMPUS / DASHBOARD</p>
          <h1 id="welcome">Welcome</h1>
          <p id="roleLabel" class="muted"></p>
        </div>
        <button id="logoutButton" class="btn btn-outline-secondary">Log out</button>
      </header>
      <div id="dashboardContent" class="row g-3"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
